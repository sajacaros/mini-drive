# Mini Drive — 전체 스택 (PRD 7절)
# 기동:  docker compose up -d --build
# 환경변수는 .env 파일에서 읽는다 (.env.example 참조). 미설정 시 아래 기본값 사용.

services:
  # ── 게이트웨이 (유일한 외부 진입점) ──────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - minidrive

  # ── 백엔드 (FastAPI) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 호스트 포트 미노출 — 모든 트래픽은 nginx 게이트웨이 경유 (rate limiting/TLS 우회 방지)
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-minidrive}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
      MINIO_BUCKET: ${MINIO_BUCKET:-minidrive}
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 프론트엔드 (React SPA, 내부 nginx 정적 서빙) ──────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - minidrive

  # ── MinIO (오브젝트 스토리지) ────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # 9000(API)/9001(콘솔) 호스트 비노출 — 내부 네트워크에서만 접근 (PRD 10 보안)
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidrive

  # ── MinIO 초기화 (버킷 생성 + 익명 접근 완전 차단) ────
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # 주의: 익명 접근은 반드시 none. download 로 열면 내부 네트워크에서 인가 없이
    # 객체를 읽을 수 있어 게이트웨이 모델(매 요청 인가)이 무력화됨 (PRD 7 주석).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change-me-in-production};
      mc mb --ignore-existing local/${MINIO_BUCKET:-minidrive};
      mc anonymous set none local/${MINIO_BUCKET:-minidrive};
      echo 'MinIO 초기화 완료: 버킷 생성 + 익명 접근 차단(none)';
      "
    networks:
      - minidrive

  # ── PostgreSQL (메타데이터 DB) ──────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-minidrive}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidrive

  # ── Redis (캐시 / 토큰 스토어) ──────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidrive

volumes:
  minio_data:
  pg_data:
  redis_data:

networks:
  minidrive:
    driver: bridge

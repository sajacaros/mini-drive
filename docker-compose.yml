# Mini Drive — 전체 스택 (PRD 7절)
# 기동:  docker compose up -d --build
# 환경변수는 .env 파일에서 읽는다 (.env.example 참조). 미설정 시 아래 기본값 사용.

# backend 와 purger(휴지통 자동 정리 사이드카)가 같은 환경을 공유한다 — 환경변수를 한 곳에서만
# 관리하기 위한 앵커다. 새 변수를 추가할 때 두 서비스에 각각 적지 않는다.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-minidrive}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
  MINIO_BUCKET: ${MINIO_BUCKET:-minidrive}
  MINIO_SECURE: "false"
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  REDIS_URL: redis://redis:6379/0
  # rate limiting 토글 — 기본 true(운영 안전). E2E 는 한 계정이 짧은 시간에 다수
  # 업로드/로그인을 수행해 분당 한도에 걸리므로, 테스트 실행 시 RATE_LIMIT_ENABLED=false 로
  # 기동해 비활성화한다 (config.py: "테스트 편의" 스위치).
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  # 휴지통 보존 기간 (spec/trash-retention-purge.md). 기본 7일 = 설정 없이도 자동 정리가 켜진다.
  # 끄려면 TRASH_RETENTION_DAYS=0 을 명시한다. 기존 스택을 업그레이드한다면 첫 회차가 예전
  # 항목을 한꺼번에 지우므로 규모부터 확인:
  #   docker compose exec backend python -m app.cli purge-trash --dry-run
  TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
  TRASH_PURGE_HOUR: ${TRASH_PURGE_HOUR:-4}
  # 첫 admin 은 셋업 위저드(첫 부팅 시 브라우저에서 /setup)로 생성한다 (PRD 3.6.2).
  # ADMIN_* 환경변수 시드는 제거됨. 비상 복구: docker compose exec backend python -m app.cli create-admin ...

services:
  # ── 게이트웨이 (유일한 외부 진입점) ──────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - minidrive

  # ── 백엔드 (FastAPI) ────────────────────────────────
  backend:
    image: flex-drive-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 호스트 포트 미노출 — 모든 트래픽은 nginx 게이트웨이 경유 (rate limiting/TLS 우회 방지)
    expose:
      - "8000"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 휴지통 자동 정리 (하루 1회, KST TRASH_PURGE_HOUR) ─
  # spec/trash-retention-purge.md. backend 와 같은 이미지를 쓰므로 빌드 비용이 없다.
  purger:
    image: flex-drive-backend:latest
    # entrypoint 를 덮어 쓴다 — 기본 entrypoint 는 alembic upgrade head 를 선행 실행하므로
    # 그대로 두면 backend 와 동시에 마이그레이션을 돌려 경합한다. 스키마는 backend 가 책임진다.
    entrypoint: ["python", "-m", "app.cli", "purge-trash", "--loop"]
    environment: *backend-env
    # 정리 카운터(minidrive_trash_purged_*)는 이 프로세스의 레지스트리에 쌓이므로 backend 의
    # /metrics 로는 보이지 않는다. 스크레이프 대상은 purger:8000 이다(호스트 미노출).
    expose:
      - "8000"
    depends_on:
      # 마이그레이션 선행 보장은 backend 기동 순서에 맡긴다(정리는 첫 실행 시각까지 자므로
      # 기동 직후 DB 를 건드리지 않는다).
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 프론트엔드 (React SPA, 내부 nginx 정적 서빙) ──────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      # 서브패스 배포용 런타임 베이스 경로. 기본 "/"(로컬/루트). 서버에서 /drive 로 띄우려면
      # BASE_PATH=/drive/ 로 오버라이드(docker-compose.deploy.yml). 이미지는 경로에 무관.
      BASE_PATH: ${BASE_PATH:-/}
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - minidrive

  # ── MinIO (오브젝트 스토리지) ────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # 9000(API)/9001(콘솔) 호스트 비노출 — 내부 네트워크에서만 접근 (PRD 10 보안)
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidrive

  # ── MinIO 초기화 (버킷 생성 + 익명 접근 완전 차단) ────
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # 주의: 익명 접근은 반드시 none. download 로 열면 내부 네트워크에서 인가 없이
    # 객체를 읽을 수 있어 게이트웨이 모델(매 요청 인가)이 무력화됨 (PRD 7 주석).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-change-me-in-production};
      mc mb --ignore-existing local/${MINIO_BUCKET:-minidrive};
      mc anonymous set none local/${MINIO_BUCKET:-minidrive};
      echo 'MinIO 초기화 완료: 버킷 생성 + 익명 접근 차단(none)';
      "
    networks:
      - minidrive

  # ── PostgreSQL (메타데이터 DB) ──────────────────────
  # pgvector/pgvector:pg16 = postgres:16 + pgvector 확장 (PRD 4장). LLM 기능 제거 후에도
  # 기존 데이터 볼륨(pg_data) 호환을 위해 이미지를 유지한다 — postgres:16 과 동일 PG16 데이터 디렉터리.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-minidrive}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidrive

  # ── Redis (캐시 / 토큰 스토어) ──────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidrive

volumes:
  minio_data:
  pg_data:
  redis_data:

networks:
  minidrive:
    driver: bridge

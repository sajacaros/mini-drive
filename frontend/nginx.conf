# frontend 컨테이너 내부 nginx: 빌드된 React SPA 정적 서빙.
# API/다운로드 프록시는 게이트웨이(루트 nginx/)가 담당하므로 여기서는 정적 파일만 다룬다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 실제 파일이 없으면 index.html 로 폴백하여 클라이언트 라우팅에 위임
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# frontend 컨테이너 내부 nginx: 빌드된 React SPA 정적 서빙.
# API/다운로드 프록시는 게이트웨이(루트 nginx/)가 담당하므로 여기서는 정적 파일만 다룬다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 실제 파일이 없으면 index.html 로 폴백하여 클라이언트 라우팅에 위임
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .mjs 를 자바스크립트로 알린다.
    # PDF 뷰어(pdf.js)의 워커는 **모듈 워커**로 뜨고(`new Worker(url, { type: "module" })`),
    # 브라우저는 모듈 워커에 자바스크립트 MIME 을 강제한다. nginx 기본 mime.types 에는 mjs 가
    # 없어 그대로 두면 application/octet-stream 으로 나가 워커가 거부되고, pdf.js 가 메인
    # 스레드에서 렌더하는 폴백으로 떨어진다 — 큰 PDF 를 휴대폰에서 열면 화면이 멈춘 것처럼 보인다.
    #
    # `types { }` 블록 대신 default_type 을 쓴다: 하위 컨텍스트의 types 는 상속받은 MIME 지도를
    # 합치지 않고 통째로 **대체**해서, 나머지 파일(css·woff2 등)의 타입까지 같이 날아간다.
    # mjs 는 지도에 없는 확장자라 default_type 만으로 정확히 이 경우에만 적용된다.
    location ~ \.mjs$ {
        default_type application/javascript;
    }
}

[project]
name = "minidrive-backend"
version = "0.1.0"
description = "Mini Drive - 사내 파일 공유/관리 서비스 백엔드"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.12",
    "minio>=7.2.10",
    "pillow>=11.0.0",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    # RAG 인덱싱 (PRD 3.7, Phase 7). arq 비동기 워커 + pgvector 타입 + LangChain 1.x 텍스트 분할/Upstage.
    "arq>=0.26.0",
    "pgvector>=0.3.6",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-upstage>=0.7.0",
    # 챗봇 (PRD 3.7.5, Phase 7-2). LangGraph retrieve→generate 파이프라인 + vLLM/OpenAI 호환 챗 모델.
    "langgraph>=1.0.0",
    "langchain-openai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

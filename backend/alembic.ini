# Alembic 설정 (Mini Drive).
# DB URL 은 여기서 하드코딩하지 않고 alembic/env.py 에서
# app.core.config.settings.database_url 로부터 주입한다.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# 마이그레이션 파일명: 리비전 앞에 날짜 프리픽스
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

# 로깅
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

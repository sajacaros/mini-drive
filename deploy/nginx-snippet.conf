# ─────────────────────────────────────────────────────────────────────────────
# 기존 host nginx 에 추가할 스니펫 — https://<host>/drive 를 Mini Drive 스택으로 프록시.
#
# 이미 TLS(443)를 처리하는 기존 server { } 블록 안에 아래 location 들을 넣는다.
# 핵심: proxy_pass 끝의 "/" 가 /drive 접두어를 떼어낸다(우리 게이트웨이는 루트 /api·/ 로 받음).
# 그래서 프론트는 BASE_PATH=/drive/ 로 /drive/... 를 만들어 보내고, 여기서 /drive 를 벗겨
# 우리 스택에는 /api·/assets·/ 로 도착한다.
# ─────────────────────────────────────────────────────────────────────────────

# /drive → /drive/ 정규화
location = /drive {
    return 301 /drive/;
}

location /drive/ {
    # ── 프록시 대상 ──────────────────────────────────────────────────────────
    # (A) 기존 nginx 가 "시스템(systemd) 설치" 또는 host 네트워크 컨테이너  ← 대부분 이 경우
    #     호스트 로컬 포트에 바로 닿는다(이름 해석·공유 네트워크 불필요, DNS 캐싱 함정도 없음).
    proxy_pass http://127.0.0.1:7755/;      # 끝 슬래시 = /drive 접두어 제거
    #
    # (B) 기존 nginx 가 "브리지 네트워크의 컨테이너"라 위 loopback 에 못 닿는 경우에만:
    #     - docker-compose.deploy.yml 의 nginx.ports 를 지우고, 양쪽을 같은 외부 네트워크에 붙인 뒤
    #     proxy_pass http://flexdrive-gateway:80/;
    #     (자세한 연결법은 deploy/DEPLOY.md 참고)

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 대용량 업로드/다운로드 (PRD 1.4: 최대 10GB)
    client_max_body_size    10g;
    proxy_request_buffering off;   # 업로드 스트리밍
    proxy_buffering         off;   # 다운로드 스트리밍
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;
}

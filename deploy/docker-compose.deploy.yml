# Mini Drive — 서버 배포용 compose (기존 nginx 뒤에 서브패스로 붙는 모델).
#
# 전제:
#   - 호스트에 이미 80/443(TLS)를 처리하는 nginx 가 있고, 그 nginx 가 https://host/drive 를
#     이 스택의 게이트웨이로 리버스 프록시한다(설정 예시는 nginx-snippet.conf 참고).
#   - 따라서 이 스택은 TLS 를 하지 않는다(certbot·443 없음). 게이트웨이는 평문 HTTP 로
#     내부 포트(127.0.0.1:8080)에만 노출한다.
#   - backend/frontend 는 build 하지 않고 Docker Hub 이미지를 pull 한다.
#   - 프론트는 BASE_PATH=/drive/ 로 시작 → 에셋/API/라우터가 /drive 아래로. (이미지는 경로에 무관)
#
# 기동(호스트에서):
#   cd /opt/flex-drive/deploy
#   export IMAGE_TAG=<git-sha>          # Jenkins 가 주입, 수동 시 latest
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ── 게이트웨이 (기존 host nginx 가 여기로 프록시) ─────
  nginx:
    image: nginx:1.27-alpine
    container_name: flexdrive-gateway
    restart: unless-stopped
    logging: *default-logging
    # 로컬호스트에만 노출 — 외부 진입은 오직 기존 host nginx 경유.
    # 기존 nginx 가 "컨테이너"라 loopback 에 못 닿으면, 아래 ports 를 지우고
    # networks 에 외부 공유망을 추가해 컨테이너명(flexdrive-gateway:80)으로 붙인다(DEPLOY.md 참고).
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # 리포 루트의 기존 HTTP 게이트웨이 설정을 그대로 재사용(listen 80, /api·/_minio·/).
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - minidrive

  # ── 백엔드 (FastAPI) — Docker Hub 이미지 ─────────────
  backend:
    image: ${DOCKERHUB_USER}/flex-drive-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-minidrive}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-minidrive}
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      ENVIRONMENT: production
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      METRICS_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 프론트엔드 (React SPA) — Docker Hub 이미지 ───────
  frontend:
    image: ${DOCKERHUB_USER}/flex-drive-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    environment:
      # 서브패스: 시작 시 정적 파일의 /__BASE__/ 를 이 값으로 치환한다. 루트로 쓰려면 "/".
      BASE_PATH: ${BASE_PATH:-/drive/}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - minidrive

  # ── MinIO (오브젝트 스토리지) ────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - minidrive

  # ── MinIO 초기화 (버킷 생성 + 익명 접근 차단) ────────
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:-minidrive};
      mc anonymous set none local/${MINIO_BUCKET:-minidrive};
      echo 'MinIO 초기화 완료: 버킷 생성 + 익명 접근 차단(none)';
      "
    networks:
      - minidrive

  # ── PostgreSQL ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-minidrive}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - minidrive

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - minidrive

volumes:
  minio_data:
  pg_data:
  redis_data:

networks:
  minidrive:
    driver: bridge

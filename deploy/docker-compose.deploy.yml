# Mini Drive — 서버 배포용 compose (기존 nginx 뒤에 서브패스로 붙는 모델).
#
# 전제:
#   - 호스트에 이미 80/443(TLS)를 처리하는 nginx 가 있고, 그 nginx 가 https://host/drive 를
#     이 스택의 게이트웨이로 리버스 프록시한다(설정 예시는 nginx-snippet.conf 참고).
#   - 따라서 이 스택은 TLS 를 하지 않는다(certbot·443 없음). 게이트웨이는 평문 HTTP 로
#     내부 포트(127.0.0.1:7755)에만 노출한다.
#   - backend/frontend 는 이 호스트에서 직접 build 한다(레지스트리 없음). 나머지는 공식 이미지 pull.
#   - 프론트는 BASE_PATH=/drive/ 로 시작 → 에셋/API/라우터가 /drive 아래로. (이미지는 경로에 무관)
#
# 기동(호스트에서):
#   cd /var/local/flex-drive/deploy
#   docker compose -f docker-compose.deploy.yml build
#   docker compose -f docker-compose.deploy.yml up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# backend 와 사이드카들(purger·wiki-indexer)이 공유하는 환경. 새 변수는 여기 한 곳에만.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-minidrive}
  # 오브젝트 스토리지(SeaweedFS S3). 클라이언트는 boto3(services/storage.py).
  S3_ENDPOINT: seaweedfs:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-minidrive}
  S3_SECURE: "false"
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  REDIS_URL: redis://redis:6379/0
  DEBUG: "false"
  ENVIRONMENT: production
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  METRICS_ENABLED: "true"
  # 휴지통 보존 기간 (spec/trash-retention-purge.md). 기본 7일 = 설정 없이도 자동 정리가 켜진다.
  # 끄려면 TRASH_RETENTION_DAYS=0 을 명시한다. 기존 스택 업그레이드 시 규모부터 확인:
  #   docker compose -f docker-compose.deploy.yml exec backend \
  #     python -m app.cli purge-trash --dry-run
  TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-7}
  TRASH_PURGE_HOUR: ${TRASH_PURGE_HOUR:-4}
  # 위키 인덱싱 (spec/wiki-index.md). 사내 vLLM 에 붙는다 — 문서 본문이 외부로 나가지 않는다.
  # 접속 정보에 기본값을 두지 않는다: 사내 주소를 리포에 박지 않기 위해서다. 값은 이 디렉터리의
  # .env 에만 둔다(.env.deploy.example 참고). 끄려면 WIKI_ENABLED=false — 사이드카는 유휴 대기한다.
  WIKI_ENABLED: ${WIKI_ENABLED:-true}
  WIKI_LLM_BASE_URL: ${WIKI_LLM_BASE_URL}
  WIKI_LLM_API_KEY: ${WIKI_LLM_API_KEY:-}
  WIKI_LLM_MODEL: ${WIKI_LLM_MODEL}
  # 생성 계열은 low 로 충분하다 — medium 이상에서는 한 마디 응답에도 추론 토큰이 폭증한다.
  WIKI_LLM_REASONING_EFFORT: ${WIKI_LLM_REASONING_EFFORT:-low}

services:
  # ── 게이트웨이 (기존 host nginx 가 여기로 프록시) ─────
  nginx:
    image: nginx:1.27-alpine
    container_name: flexdrive-gateway
    restart: unless-stopped
    logging: *default-logging
    # 로컬호스트에만 노출 — 외부 진입은 오직 기존 host nginx 경유.
    # 기존 nginx 가 "컨테이너"라 loopback 에 못 닿으면, 아래 ports 를 지우고
    # networks 에 외부 공유망을 추가해 컨테이너명(flexdrive-gateway:80)으로 붙인다(DEPLOY.md 참고).
    ports:
      - "127.0.0.1:7755:80"
    volumes:
      # 리포 루트의 기존 HTTP 게이트웨이 설정을 그대로 재사용(listen 80, /api·/_s3·/).
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - minidrive

  # ── 백엔드 (FastAPI) — 호스트에서 빌드 ───────────────
  backend:
    image: flex-drive-backend:latest
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
    environment: *backend-env
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 휴지통 자동 정리 (하루 1회, KST TRASH_PURGE_HOUR) ─
  # spec/trash-retention-purge.md. backend 와 같은 이미지를 쓰므로 별도 빌드가 없다.
  purger:
    image: flex-drive-backend:latest
    restart: unless-stopped
    logging: *default-logging
    # entrypoint 를 덮어 쓴다 — 기본 entrypoint 의 alembic upgrade head 가 backend 와
    # 동시에 돌면 경합한다. 스키마는 backend 가 책임진다.
    entrypoint: ["python", "-m", "app.cli", "purge-trash", "--loop"]
    environment: *backend-env
    # 정리 카운터는 이 프로세스의 레지스트리에 쌓인다 — 스크레이프 대상은 purger:8000.
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 위키 인덱싱 워커 (큐 구동) ────────────────────────
  # spec/wiki-index.md. purger 와 달리 스케줄이 아니라 Redis 큐를 본다 — 업로드·토글 직후
  # 반응이 있어야 하기 때문이다. backend 와 같은 이미지라 별도 빌드가 없다.
  wiki-indexer:
    image: flex-drive-backend:latest
    restart: unless-stopped
    logging: *default-logging
    # 기본 entrypoint 의 alembic upgrade head 를 덮어쓴다 — 스키마는 backend 가 책임진다
    # (purger 와 같은 이유).
    entrypoint: ["python", "-m", "app.cli", "index-wiki", "--loop"]
    environment: *backend-env
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - minidrive

  # ── 프론트엔드 (React SPA) — 호스트에서 빌드 ─────────
  frontend:
    image: flex-drive-frontend:latest
    build:
      context: ../frontend
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    environment:
      # 서브패스: 시작 시 정적 파일의 /__BASE__/ 를 이 값으로 치환한다. 루트로 쓰려면 "/".
      BASE_PATH: ${BASE_PATH:-/drive/}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - minidrive

  # ── SeaweedFS (S3 호환 오브젝트 스토리지) ──────────────
  # MinIO 커뮤니티판 지원 종료로 교체(루트 docker-compose.yml 의 같은 서비스 주석 참고).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    logging: *default-logging
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -master.volumeSizeLimitMB=1024
    expose:
      - "9000"
    environment:
      # 유일한 관리자 identity — 있으면 익명 요청은 403 (게이트웨이 모델 전제, PRD 7).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - minidrive

  # ── SeaweedFS 초기화 (버킷 생성, 이미 있으면 통과) ───
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw '${S3_BUCKET:-minidrive}' || echo 's3.bucket.create -name ${S3_BUCKET:-minidrive}' | weed shell -master=seaweedfs:9333 2>&1 | grep -q 'created bucket';
      do sleep 2; done;
      echo 'SeaweedFS 초기화 완료: 버킷 ${S3_BUCKET:-minidrive} 준비';
      "
    networks:
      - minidrive

  # ── 버킷 백업/복원 도구 (scripts/backup.sh·restore.sh 전용, 평소엔 안 뜬다) ──
  # profiles 로 묶어 `up` 에서 제외한다. 범용 S3 클라이언트라 스토리지 제품에 묶이지 않는다.
  # 원격 이름 "s3" 를 환경변수로만 정의한다(설정 파일 없음): rclone sync s3:<bucket> <dir>
  rclone:
    image: rclone/rclone:1.68.2
    profiles: ["tools"]
    environment:
      RCLONE_CONFIG_S3_TYPE: s3
      RCLONE_CONFIG_S3_PROVIDER: SeaweedFS
      RCLONE_CONFIG_S3_ENDPOINT: http://seaweedfs:9000
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      # 설정 파일이 없다는 NOTICE 를 끈다(위 환경변수가 전부다).
      RCLONE_CONFIG: /dev/null
    networks:
      - minidrive

  # ── PostgreSQL ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-minidrive}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - minidrive

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - minidrive

volumes:
  seaweedfs_data:
  pg_data:
  redis_data:

networks:
  minidrive:
    driver: bridge

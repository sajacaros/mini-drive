# Mini Drive 게이트웨이 서버 블록 (PRD 8절).
# 유일한 외부 진입점: FE 정적 서빙 · API 프록시 · MinIO 내부 스트리밍(X-Accel-Redirect).

server {
    listen 80;
    server_name _;

    # 최대 파일 크기 10 GB (PRD 1.4)
    client_max_body_size 10g;

    # ── 보안 헤더 ───────────────────────────────────────
    # server 레벨에 두면 add_header 를 따로 쓰지 않는 하위 location 이 전부 상속한다.
    # `always` 는 4xx/5xx 응답에도 붙이라는 뜻이다 — 기본값은 2xx/3xx 일부뿐이라, 그냥 두면
    # 오류 응답만 헤더 없이 나간다.
    #
    # 이 서비스에 특히 중요한 이유가 두 가지 있다.
    #   1) 미리보기가 **사용자가 올릴 때 지정한 MIME 을 그대로 Content-Type 으로 되돌려준다.**
    #      backend 가 text/* 와 SVG 를 text/plain 으로 강제해 렌더를 막고 있지만(previews.py),
    #      nosniff 가 있어야 브라우저의 컨텐츠 스니핑이라는 두 번째 경로까지 닫힌다.
    #   2) refresh 토큰이 localStorage 에 있다(7일). XSS 한 번이 곧 세션 탈취라 script-src 를
    #      좁히는 값이 크다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # 공유 링크 토큰이 **경로에 들어 있다**(/s/{token}). 외부로 나가는 Referer 에 그 주소가
    # 실리면 토큰이 제3자 로그에 남으므로 동일 출처 밖으로는 보내지 않는다.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # CSP — script-src 는 'self' 로 좁힌다(빌드 산출물이 외부 JS 파일뿐이라 인라인 예외가 필요 없다).
    #   style-src 'unsafe-inline' : React 의 style={{...}} 속성 38곳. CSP3 에서 인라인 style
    #                               **속성**도 style-src 를 따르므로 빼면 레이아웃이 깨진다.
    #                               스타일 인라인은 토큰 탈취로 이어지지 않아 script-src 와 위험이 다르다.
    #   img/media/frame blob:     : 미리보기가 바이트를 blob objectURL 로 만들어 <img>/<video>/
    #                               <iframe>(PDF) 에 물린다(lib/preview.ts).
    #   connect-src 'self'        : API·SSE 가 전부 동일 출처다(게이트웨이 모델).
    # TLS(443)를 켤 때 Strict-Transport-Security 를 여기 함께 추가한다 — HTTP 에서 보내면 무의미하다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ── upstream 런타임 재해석 (stale IP 502 방지) ──────────────────────────
    # 도커 내장 DNS(127.0.0.11)로 "요청 시점"에 컨테이너 IP 를 다시 해석한다.
    # proxy_pass 에 변수를 쓰면 nginx 가 시작 시 이름을 한 번만 해석해 캐시하지 않고,
    # valid= 만료마다 다시 조회한다. 변수 미사용(upstream 블록/고정 이름)이면 재시작
    # 전까지 옛 IP 를 물고 있어, backend/frontend 를 재빌드(→ 새 컨테이너 IP)할 때마다
    # "connect() failed (113: Host is unreachable)" 502 가 났다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream  backend:8000;
    set $frontend_upstream frontend:80;
    set $minio_upstream    minio:9000;

    # ── 배치 업로드 (폴더 업로드) ───────────────────────
    # 여러 작은 파일을 한 요청에 묶는 엔드포인트라 본문 상한이 파일 1개 상한(10g)과 다르다.
    # backend 의 max_batch_bytes(64MiB)에 여유를 둔 값으로, 과대한 본문을 게이트웨이에서
    # 먼저 떨어뜨려 백엔드 워커가 파싱에 묶이지 않게 한다(앱은 미들웨어로 이중 방어).
    # location = 은 접두어 location 보다 우선하므로 아래 /api/ 블록보다 먼저 매칭된다.
    location = /api/files/batch {
        client_max_body_size 80m;

        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── API 프록시 (FastAPI) ────────────────────────────
    location /api/ {
        # $request_uri = 원본 URI(쿼리 포함)를 그대로 전달 → 고정 이름의 proxy_pass 와 동일 동작.
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대용량 업로드: 디스크 버퍼링 없이 backend 로 스트리밍
        proxy_request_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # backend /health (게이트웨이 상태 점검용)
    location = /health {
        proxy_pass http://$backend_upstream/health;
        proxy_set_header Host $host;
    }

    # ── Prometheus 메트릭 외부 노출 차단 (PRD 11장) ──────
    # backend:8000/metrics 는 내부 도커 네트워크의 스크레이퍼만 접근한다.
    # 게이트웨이(유일한 외부 진입점)에서는 명시적으로 차단해 인스턴스 내부 지표가
    # 외부로 새지 않도록 한다.
    location = /metrics {
        deny all;
        return 403;
    }

    # ── MinIO 내부 스트리밍 프록시 (X-Accel-Redirect 대상) ──
    # backend 가 인가 후 X-Accel-Redirect: /_minio/<internal-presigned-url> 를 반환하면
    # nginx 가 아래 location 으로 내부 재지향하여 MinIO 객체를 스트리밍한다.
    # internal 이므로 브라우저가 직접 접근할 수 없다.
    # 변수 proxy_pass 는 location 접두어 자동 제거를 하지 않으므로, 정규식 캡처로
    # /_minio/ 를 벗겨 뒤쪽 <path> 만 minio 로 넘긴다($is_args$args 로 presigned 쿼리 보존).
    location ~ ^/_minio/(?<minio_path>.*)$ {
        internal;
        proxy_pass http://$minio_upstream/$minio_path$is_args$args;

        # SigV4 서명 Host 일치 강제 (PRD 12 리스크 대응)
        proxy_set_header Host $minio_upstream;
        # 브라우저 Authorization 헤더가 MinIO 로 누수되지 않도록 비운다
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;

        # 대용량 다운로드: 디스크 버퍼링 없이 스트리밍
        proxy_buffering off;
    }

    # ── 프론트엔드 SPA (frontend 컨테이너 nginx 로 프록시) ──
    location / {
        proxy_pass http://$frontend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

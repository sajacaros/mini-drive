# Mini Drive 게이트웨이 서버 블록 (PRD 8절).
# 유일한 외부 진입점: FE 정적 서빙 · API 프록시 · MinIO 내부 스트리밍(X-Accel-Redirect).

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # 최대 파일 크기 10 GB (PRD 1.4)
    client_max_body_size 10g;

    # ── API 프록시 (FastAPI) ────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대용량 업로드: 디스크 버퍼링 없이 backend 로 스트리밍
        proxy_request_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # backend /health (게이트웨이 상태 점검용)
    location = /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
    }

    # ── Prometheus 메트릭 외부 노출 차단 (PRD 11장) ──────
    # backend:8000/metrics 는 내부 도커 네트워크의 스크레이퍼만 접근한다.
    # 게이트웨이(유일한 외부 진입점)에서는 명시적으로 차단해 인스턴스 내부 지표가
    # 외부로 새지 않도록 한다.
    location = /metrics {
        deny all;
        return 403;
    }

    # ── MinIO 내부 스트리밍 프록시 (X-Accel-Redirect 대상) ──
    # backend 가 인가 후 X-Accel-Redirect: /_minio/<internal-presigned-url> 를 반환하면
    # nginx 가 아래 location 으로 내부 재지향하여 MinIO 객체를 스트리밍한다.
    # internal 이므로 브라우저가 직접 접근할 수 없다.
    location /_minio/ {
        internal;
        proxy_pass http://minio:9000/;

        # SigV4 서명 Host 일치 강제 (PRD 12 리스크 대응)
        proxy_set_header Host minio:9000;
        # 브라우저 Authorization 헤더가 MinIO 로 누수되지 않도록 비운다
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;

        # 대용량 다운로드: 디스크 버퍼링 없이 스트리밍
        proxy_buffering off;
    }

    # ── 프론트엔드 SPA (frontend 컨테이너 nginx 로 프록시) ──
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
